[package]
name = "dvp_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]
# Standalone workspace - isolated from parent project to avoid Solana version conflicts

[dependencies]
# Fuzzing framework
borsh = "1.5.5"
crucible-fuzzer = "0.3.0-alpha.1"
crucible-test-context = "0.3.0-alpha.1"
litesvm-token = { version = "=0.15.2", features = ["token-2022"] }
anchor-lang = "1.0.1"

# Solana v3.x (required for litesvm 0.9.0)
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-program = "3.0"
solana-message = "3.0"
solana-signature = "3.1"
solana-instruction = "3.1"
spl-token-2022 =  { version = "6.0.0", features = ["no-entrypoint"] }
solana-program-pack = "2"
solana-account = "4.3.0"

# Fuzzing
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
arbitrary = { version = "1", features = ["derive"] }

# Utilities
anyhow = "1.0"
bytemuck = "1.14"
ctor = "0.6"
ctrlc = "3.4"
spl-token-2022-interface = "2.1.0"
litesvm-token-extensions = "0.1.0"

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
invariant_test = []
